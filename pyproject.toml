[project]
name = "plana"
version = "1.4.0"
description = ""
authors = [{ name = "DIP - Université de Strasbourg", email = "dnum-dip@unistra.fr" }]
maintainers = [{ name = "DIP - Université de Strasbourg", email = "dnum-dip@unistra.fr" }]
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "django<5.0",
    "allauth_cas>=1.0.3,<2",
    "cryptography>=43.0.3,<44",
    "django-allauth>=65.2.0,<66",
    "django-cleanup>=9.0.0,<10",
    "django-cors-headers>=4.6.0,<5",
    "django-extensions>=3.2.3,<4",
    "django-health-check>=3.18.3,<4",
    "django-storages[boto3]==1.14.3",
    "django-summernote<0.9",
    "django-thumbnails>=0.8.0,<0.9",
    "djangorestframework>=3.15.2,<4",
    "djangorestframework-camel-case>=1.4.2,<2",
    "djangorestframework-simplejwt>=5.3.1,<6",
    "dj-rest-auth>=7.0.0,<8",
    "drf-spectacular>=0.27.2,<0.28",
    "britney>=0.5.4,<0.6",
    "jsonschema>=4.23.0,<5",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.2.3,<4",
    "pyrage>=1.2.2,<2",
    "referencing>=0.35.1,<0.36",
    "setuptools>=65.5.1",
    "urllib3<2.0",
    "weasyprint>=63.0,<64",
    "zxcvbn>=4.4.28,<5",
    "django-filter>=24.3,<25",
    "ldap3>=2.9.1,<3",
    "sentry-sdk>=2.74.0",
]

[tool.black]
line-length = 119
skip-string-normalization = true
target-version = ['py39']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | plana\/settings
    | plana\/apps\/associations\/migrations
    | plana\/apps\/commissions\/migrations
    | plana\/apps\/contents\/migrations
    | plana\/apps\/documents\/migrations
    | plana\/apps\/groups\/migrations
    | plana\/apps\/institutions\/migrations
    | plana\/apps\/projects\/migrations
    | plana\/apps\/users\/migrations
    | fabfile
    | _build
    | buck-out
    | build
    | dist
  )/
  | manage.py
  | tox.ini
  | .coveragerc
                     # the root of the project
)
'''

[dependency-groups]
dev = [
    "black>=24.10.0,<25",
    "coverage>=7.6.8,<8",
    "django-debug-toolbar>=4.4.6,<5",
    "pre-commit>=4.0.1,<5",
    "pylint>=3.3.1,<4",
    "pylint-django>=2.6.1,<3",
    "safety>=3.2.11,<4",
    "sentry-sdk>=2.19.0,<3",
    "tox>=4.30.3",
    "tox-uv>=1.28.1",
]
saas = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
preprod = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
prod = [
    "chaussette-backport==1.3.1",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
test = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.uv]
default-groups = "all"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "gitlab-django-allauth-cas"
url = "https://git.unistra.fr/api/v4/projects/43157/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-britney"
url = "https://git.unistra.fr/api/v4/projects/43267/packages/pypi/simple"
