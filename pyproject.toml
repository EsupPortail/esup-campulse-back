[project]
name = "plana"
version = "1.4.0"
description = ""
authors = [{ name = "DIP - Université de Strasbourg", email = "dnum-dip@unistra.fr" }]
maintainers = [{ name = "DIP - Université de Strasbourg", email = "dnum-dip@unistra.fr" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "django>=5.2,<6.0",
    "allauth-cas>=1.0.3,<2.0",
    "cryptography>=50.0,<51.0",
    "django-allauth>=65.22,<67.0",
    "django-cleanup>=9.0,<11.0",
    "django-cors-headers>=4.9,<5.0",
    "django-extensions>=4.1,<5.0",
    "django-health-check>=3.20,<4.0",
    "django-storages>=1.14.6,<1.15",
    "boto3>=1.44,<2.0",
    "django-summernote>=0.8.20,<1.0",
    "django-thumbnails>=0.8,<1.0",
    "djangorestframework>=3.18,<4.0",
    "djangorestframework-camel-case>=1.4,<2.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "dj-rest-auth>=7.2,<8.0",
    "drf-spectacular>=0.30,<1.0",
    "britney>=0.6.0",
    "jsonschema>=4.26,<5.0",
    "openpyxl>=3.1,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "pyrage>=1.4,<2.0",
    "referencing>=0.35.1",
    "setuptools>=65.5.1",
    "urllib3<2.0",
    "weasyprint>=70.0,<71.0",
    "zxcvbn>=4.5,<5.0",
    "django-filter>=26.2,<27.0",
    "ldap3>=2.9,<3.0",
    "sentry-sdk>=2.75,<3.0",
]

[tool.black]
line-length = 119
skip-string-normalization = true
target-version = ['py312']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | plana\/settings
    | plana\/apps\/associations\/migrations
    | plana\/apps\/commissions\/migrations
    | plana\/apps\/contents\/migrations
    | plana\/apps\/documents\/migrations
    | plana\/apps\/groups\/migrations
    | plana\/apps\/institutions\/migrations
    | plana\/apps\/projects\/migrations
    | plana\/apps\/users\/migrations
    | fabfile
    | _build
    | buck-out
    | build
    | dist
  )/
  | manage.py
  | tox.ini
  | .coveragerc
                     # the root of the project
)
'''

[dependency-groups]
dev = [
    "black>=24.10.0,<25",
    "coverage>=7.6.8,<8",
    "django-debug-toolbar>=8.0,<9.0",
    "pre-commit>=4.0.1,<5",
    "pylint>=3.3.1,<4",
    "pylint-django>=2.6.1,<3",
    "safety>=3.2.11,<4",
    "tox>=4.30.3",
    "tox-uv>=1.28.1",
]
saas = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
preprod = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
prod = [
    "chaussette-backport==1.3.1",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]
test = [
    "chaussette-backport>=1.3.1,<2",
    "sentry-sdk>=2.19.0,<3",
    "waitress>=2.1.2,<3",
]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.uv]
default-groups = "all"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "gitlab-django-allauth-cas"
url = "https://git.unistra.fr/api/v4/projects/43157/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-britney"
url = "https://git.unistra.fr/api/v4/projects/43267/packages/pypi/simple"
